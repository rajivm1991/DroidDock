[package]
name = "droiddock"
version = "0.7.0"
description = "macOS app for browsing Android device files via ADB"
authors = ["rajivm1991"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "droiddock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
tempfile = "3"
md5 = "0.7"
walkdir = "2"
glob = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["time"] }

# Setup picker: one NSOpenPanel that accepts a file or a folder (Tauri's
# dialog plugin is file-xor-folder). Hidden files follow Finder preference.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSWindow", "NSApplication"] }

